          - listitem [ref=e83]: Wait for 3 seconds for the second input field to be displayed
          - listitem [ref=e84]: Verify second input field is displayed
        - paragraph [ref=e85]: The second row shows up after about 5 seconds, so a 3-second timeout is not enough. That’s why we will get TimeoutException while executing steps in the above test case.
