          - listitem [ref=e74]: Find the instructions text element
          - listitem [ref=e75]: Push add button
          - listitem [ref=e76]: Verify instruction text element is no longer displayed
        - paragraph [ref=e77]: The instructions element is removed from the page when the second row is added. That’s why we can no longer interact with it. Otherwise, we will see StaleElementReferenceException.
        - separator [ref=e78]
