        - separator [ref=e43]
        - 'heading "Test case 1: NoSuchElementException" [level=5] [ref=e44]'
        - list [ref=e45]:
          - listitem [ref=e46]: Open page
          - listitem [ref=e47]: Click Add button
          - listitem [ref=e48]: Verify Row 2 input field is displayed
        - paragraph [ref=e49]: Row 2 doesn’t appear immediately. This test will fail with org.openqa.selenium.NoSuchElementException without proper wait
        - separator [ref=e50]
        - 'heading "Test case 2: ElementNotInteractableException" [level=5] [ref=e51]'
        - list [ref=e52]:
          - listitem [ref=e53]: Open page
          - listitem [ref=e54]: Click Add button
          - listitem [ref=e55]: Wait for the second row to load
          - listitem [ref=e56]: Type text into the second input field
          - listitem [ref=e57]: Push Save button using locator By.name(“Save”)
          - listitem [ref=e58]: Verify text saved
        - paragraph [ref=e59]:
          - text: This page contains two elements with attribute name=”Save”.
          - text: The first one is invisible. So when we are trying to click on the invisible element, we get ElementNotInteractableException.
        - paragraph [ref=e60]: The same action used to throw ElementNotVisibleException, but now it throws a different exception (not sure if it’s a bug in Selenium or a feature)
        - separator [ref=e61]
        - 'heading "Test case 3: InvalidElementStateException" [level=5] [ref=e62]'
        - list [ref=e63]:
          - listitem [ref=e64]: Open page
          - listitem [ref=e65]: Clear input field
          - listitem [ref=e66]: Type text into the input field
          - listitem [ref=e67]: Verify text changed
        - paragraph [ref=e68]: The input field is disabled. Trying to clear the disabled field will throw InvalidElementStateException. We need to enable editing of the input field first by clicking the Edit button.
        - paragraph [ref=e69]: If we try to type text into the disabled input field, we will get ElementNotInteractableException, as in Test case 2.
        - separator [ref=e70]
