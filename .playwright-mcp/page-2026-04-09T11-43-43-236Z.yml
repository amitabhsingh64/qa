"}],\"replies\":[{\"embeddable\":true,\"href\":\"https:\\/\\/practicetestautomation.com\\/wp-json\\/wp\\/v2\\/comments?post=172\"}],\"version-history\":[{\"count\":2,\"href\":\"https:\\/\\/practicetestautomation.com\\/wp-json\\/wp\\/v2\\/pages\\/172\\/revisions\"}],\"predecessor-version\":[{\"id\":174,\"href\":\"https:\\/\\/practicetestautomation.com\\/wp-json\\/wp\\/v2\\/pages\\/172\\/revisions\\/174\"}],\"wp:attachment\":[{\"href\":\"https:\\/\\/practicetestautomation.com\\/wp-json\\/wp\\/v2\\/media?parent=172\"}],\"curies\":[{\"name\":\"wp\",\"href\":\"https:\\/\\/api.w.org\\/{rel}\",\"templated\":true}]}},{\"id\":139,\"date\":\"2019-10-19T15:41:29\",\"date_gmt\":\"2019-10-19T19:41:29\",\"guid\":{\"rendered\":\"https:\\/\\/practicetestautomation.com\\/?page_id=139\"},\"modified\":\"2019-10-19T16:42:14\",\"modified_gmt\":\"2019-10-19T20:42:14\",\"slug\":\"advanced-selenium-course\",\"status\":\"publish\",\"type\":\"page\",\"link\":\"https:\\/\\/practicetestautomation.com\\/advanced-selenium-course\\/\",\"title\":{\"rendered\":\"Advanced Selenium testing framework with Java\"},\"content\":{\"rendered\":\"\\n<p>Hi. Welcome to the very first course I created and published online. <\\/p>\\n\\n\\n\\n<p>It was created for my friends, who wanted to learn advanced test automation. But later I decided to share this course with everyone else.<\\/p>\\n\\n\\n\\n<p>This course is far from perfect, and may not be a good fit for Test Automation beginners. I suggest taking this course to those students, who already have some test automation and java experience, and are familiar with object-oriented programming.<\\/p>\\n\\n\\n\\n<p>But if you do not have any experience with Selenium WebDriver or Java, take a look at my <strong><a href=\\\"https:\\/\\/practicetestautomation.com\\/courses\\/\\\">Selenium WebDriver with Java for beginners course here<\\/a><\\/strong><\\/p>\\n\\n\\n\\n<p>In this Selenium tutorial, students will learn in just 3 hours how to start and create an advanced test automation testing\\u00a0framework using Selenium WebDriver with\\u00a0Java, Maven, and TestNG. Improve their current Test Automation skills by learning Page Object Model, TestNG Annotations, parameters and&nbsp;test listeners.<\\/p>\\n\\n\\n\\n<p>What you&#8217;ll learn in this course:<\\/p>\\n\\n\\n\\n<ul class=\\\"wp-block-list\\\"><li>Build a test framework in Selenium WebDriver from scratch using Java and TestNG <\\/li><li>Create reliable, stable and easy maintainable automated tests <\\/li><li>Use the Page Object Model for the better test structure <\\/li><li>Master Selenium Webdriver <\\/li><li>Create a Data-Driven Test Framework<\\/li><\\/ul>\\n\\n\\n\\n<h2 class=\\\"wp-block-heading\\\">Lecture 0 &#8211; Intro<\\/h2>\\n\\n\\n\\n<figure class=\\\"wp-block-embed-youtube wp-block-embed is-type-video is-provider-youtube wp-embed-aspect-16-9 wp-has-aspect-ratio\\\"><div class=\\\"wp-block-embed__wrapper\\\">\\n<iframe loading=\\\"lazy\\\" title=\\\"Selenium webdriver test framework from scratch - 0 - Intro\\\" width=\\\"500\\\" height=\\\"281\\\" src=\\\"https:\\/\\/www.youtube.com\\/embed\\/wmsuWw5Qm3c?feature=oembed\\\" frameborder=\\\"0\\\" allow=\\\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share\\\" referrerpolicy=\\\"strict-origin-when-cross-origin\\\" allowfullscreen><\\/iframe>\\n<\\/div><\\/figure>\\n\\n\\n\\n<hr class=\\\"wp-block-separator\\\"\\/>\\n\\n\\n\\n<h2 class=\\\"wp-block-heading\\\">Lecture 1 &#8211; Preparation<\\/h2>\\n\\n\\n\\n<figure class=\\\"wp-block-embed-youtube wp-block-embed is-type-video is-provider-youtube wp-embed-aspect-16-9 wp-has-aspect-ratio\\\"><div class=\\\"wp-block-embed__wrapper\\\">\\n<iframe loading=\\\"lazy\\\" title=\\\"Selenium webdriver test framework from scratch - 1 - Preparation\\\" width=\\\"500\\\" height=\\\"281\\\" src=\\\"https:\\/\\/www.youtube.com\\/embed\\/4psRWTagyvQ?feature=oembed\\\" frameborder=\\\"0\\\" allow=\\\"accelerometer; autoplay; cli