\":[{\"name\":\"wp\",\"href\":\"https:\\/\\/api.w.org\\/{rel}\",\"templated\":true}]}},{\"id\":503,\"date\":\"2021-05-29T10:55:56\",\"date_gmt\":\"2021-05-29T14:55:56\",\"guid\":{\"rendered\":\"https:\\/\\/practicetestautomation.com\\/?page_id=503\"},\"modified\":\"2021-06-08T22:20:36\",\"modified_gmt\":\"2021-06-09T02:20:36\",\"slug\":\"xpath-cheat-sheet-5\",\"status\":\"publish\",\"type\":\"page\",\"link\":\"https:\\/\\/practicetestautomation.com\\/xpath-cheat-sheet-5\\/\",\"title\":{\"rendered\":\"XPath cheat sheet\"},\"content\":{\"rendered\":\"\\n<p>XPath or XML Path Language is a query language for selecting nodes from an XML document. Also, people used it to compute values from the content of an XML document. <\\/p>\\n\\n\\n\\n<p>When using Selenium to automate tests, and there are no ID or Name that we can use to find an element on the page, XPath can help. XPath can find the location of any element on a web page even those without class, name, or id attributes. Most importantly, it produces reliable locators if used correctly, but at the same time, It is the most complicated method of identifying elements.<\\/p>\\n\\n\\n\\n<p>My <a href=\\\"https:\\/\\/practicetestautomation.com\\/xpath-locators-for-selenium-teachable-checkout\\\" target=\\\"_blank\\\" rel=\\\"noreferrer noopener\\\"><strong>XPath locators for Selenium<\\/strong><\\/a> course is a Bestseller&nbsp;course in the&nbsp;Selenium Testing Framework&nbsp;category. You can learn how to build complex XPath locators for Selenium automation that will work on any web element. However, it&#8217;s easy to forget all the formulas, syntax, and techniques that you can learn in that course. <\\/p>\\n\\n\\n\\n<p>That&#8217;s why I created an XPath cheat sheet. It&#8217;s easy to download and print on a piece of paper, to use every time you need to build a cool XPath locator. This cheat sheet contains everything you learned in that course. There are two versions of the cheat sheet, so you can download and choose the one you like better.<\\/p>\\n\\n\\n\\n<p>Below are the links to download XPath cheat sheet.<\\/p>\\n\\n\\n\\n<div class=\\\"wp-block-columns are-vertically-aligned-center is-layout-flex wp-container-core-columns-is-layout-9d6595d7 wp-block-columns-is-layout-flex\\\">\\n<div class=\\\"wp-block-column is-vertically-aligned-center is-layout-flow wp-block-column-is-layout-flow\\\">\\n<div class=\\\"wp-block-file\\\"><a href=\\\"https:\\/\\/practicetestautomation.com\\/wp-content\\/uploads\\/2021\\/05\\/XPATH-CHEAT-SHEET.pdf\\\">Landscape PDF file<\\/a><a href=\\\"https:\\/\\/practicetestautomation.com\\/wp-content\\/uploads\\/2021\\/05\\/XPATH-CHEAT-SHEET.pdf\\\" class=\\\"wp-block-file__button\\\" download>Download<\\/a><\\/div>\\n\\n\\n\\n<div class=\\\"wp-block-file\\\"><a href=\\\"https:\\/\\/practicetestautomation.com\\/wp-content\\/uploads\\/2021\\/05\\/XPATH-CHEAT-SHEET-1.png\\\">Landscape PNG file<\\/a><a href=\\\"https:\\/\\/practicetestautomation.com\\/wp-content\\/uploads\\/2021\\/05\\/XPATH-CHEAT-SHEET-1.png\\\" class=\\\"wp-block-file__button\\\" download>Download<\\/a><\\/div>\\n<\\/div>\\n\\n\\n\\n<div class=\\\"wp-block-column is-vertically-aligned-center is-layout-flow wp-block-column-is-layout-flow\\\">\\n<div class=\\\"wp-block-file\\\"><a href=\\\"https:\\/\\/practicetestautomation.com\\/wp-content\\/uploads\\/2021\\/05\\/Xpath-cheat-sheet.pdf\\\">Portrait PDF file<\\/a><a href=\\\"https:\\/\\/practicetestautomation.com\\/wp-content\\/uploads\\/2021\\/05\\/Xpath-cheat-sheet.pdf\\\" class=\\\"wp-block-file__button\\\" download>Download<\\/a><\\/div>\\n\\n\\n\\n<div class=\\\"wp-block-file\\\"><a href=\\\"https:\\/\\/practicetestautomation.com\\/wp-content\\/uploads\\/2021\\/05\\/Xpath-cheat-sheet.png\\\">Portrait PNG file<\\/a><a href=\\\"https:\\/\\/practicetestautomation.com\\/wp-content\\/uploads\\/2021\\/05\\/Xpath-cheat-sheet.png\\\" class=\\\"wp-block-file__button\\\" download>Download<\\/a><\\/div>\\n<\\/div>\\n<\\/div>\\n\\n\\n\\n<figure class=\\\"wp-block-image size-large\\\"><img data-recalc-dims=\\\"1\\\" loading=\\\"lazy\\\" decoding=\\\"async\\\" width=\\\"1024\\\" height=\\\"576\\\" src=\\\"https:\\/\\/i0.wp.com\\/practicetestautomation.com\\/wp-content\\/uploads\\/2021\\/05\\/XPath-cheat-cheet-page.png?resize=1024%2C576&#038;ssl=1\\\" alt=\\\"\\\" class=\\\"wp-image-511\\\" srcset=\\\"https:\\/\\/i0.wp.com\\/practicetestautomation.com\\/wp-content\\/uploads\\/2021\\/05\\/XPath-cheat-cheet-page.png?resize=1024%2C576&amp;ssl=1 1024w, https:\\/\\/i0.wp.com\\/practicetestautomation.com\\/wp-content\\/uploads\\/2021\\/05\\/XPath-cheat-cheet-page.png?resize=300%2C169&amp;ssl=1 300w, https:\\/\\/i0.wp.com\\/practicetestautomation.com\\/wp-content\\/uploads\\/2021\\/05\\/XPath-cheat-cheet-page.png?resize=768%2C432&amp;ssl=1 768w, https:\\/\\/i0.wp.com\\/practicetestautomation.com\\/wp-content\\/uploads\\/2021\\/05\\/XPath-cheat-cheet-page.png?w=1280&amp;ssl=1 1280w\\\" sizes=\\\"auto, (max-width: 1000px) 100vw, 1000px\\\" \\/><\\/figure>\\n\",\"protected\":false},\"excerpt\":{\"rendered\":\"<p>XPath or XML Path Language is a query language for selecting nodes from an XML document. Also, people used it to compute values from the&#8230;<\\/p>\\n<div class=\\\"more-link-wrapper\\\"><a class=\\\"more-link\\\" href=\\\"https:\\/\\/practicetestautomation.com\\/xpath-cheat-sheet-5\\/\\\">Read More<span class=\\\"screen-reader-text\\\">XPath cheat sheet<\\/span><\\/a><\\/div>\\n\",\"protected\":false},\"author\":2,\"featured_media\":0,\"parent\":0,\"menu_order\":0,\"comment_status\":\"closed\",\"ping_status\":\"closed\",\"template\":\"\",\"meta\":{\"nf_dc_page\":\"\",\"_exactmetrics_skip_tracking\":false,\"_exactmetrics_sitenote_active\":false,\"_exactmetrics_sitenote_note\":\"\",\"_exactmetrics_sitenote_category\":0,\"footnotes\":\"\"},\"class_list\":[\"post-503\",\"page\",\"type-page\",\"status-publish\",\"hentry\",\"entry\"],\"yoast_head\":\"<!-- This site is optimized with the Yoast SEO plugin v26.9 - h