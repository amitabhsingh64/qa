rson\\/image\\/\"}}]}},\"jetpack_sharing_enabled\":true,\"jetpack_shortlink\":\"https:\\/\\/wp.me\\/PbmoN3-87\",\"_links\":{\"self\":[{\"href\":\"https:\\/\\/practicetestautomation.com\\/wp-json\\/wp\\/v2\\/pages\\/503\",\"targetHints\":{\"allow\":[\"GET\"]}}],\"collection\":[{\"href\":\"https:\\/\\/practicetestautomation.com\\/wp-json\\/wp\\/v2\\/pages\"}],\"about\":[{\"href\":\"https:\\/\\/practicetestautomation.com\\/wp-json\\/wp\\/v2\\/types\\/page\"}],\"author\":[{\"embeddable\":true,\"href\":\"https:\\/\\/practicetestautomation.com\\/wp-json\\/wp\\/v2\\/users\\/2\"}],\"replies\":[{\"embeddable\":true,\"href\":\"https:\\/\\/practicetestautomation.com\\/wp-json\\/wp\\/v2\\/comments?post=503\"}],\"version-history\":[{\"count\":6,\"href\":\"https:\\/\\/practicetestautomation.com\\/wp-json\\/wp\\/v2\\/pages\\/503\\/revisions\"}],\"predecessor-version\":[{\"id\":915,\"href\":\"https:\\/\\/practicetestautomation.com\\/wp-json\\/wp\\/v2\\/pages\\/503\\/revisions\\/915\"}],\"wp:attachment\":[{\"href\":\"https:\\/\\/practicetestautomation.com\\/wp-json\\/wp\\/v2\\/media?parent=503\"}],\"curies\":[{\"name\":\"wp\",\"href\":\"https:\\/\\/api.w.org\\/{rel}\",\"templated\":true}]}},{\"id\":400,\"date\":\"2020-09-08T17:11:57\",\"date_gmt\":\"2020-09-08T21:11:57\",\"guid\":{\"rendered\":\"https:\\/\\/practicetestautomation.com\\/?page_id=400\"},\"modified\":\"2025-09-25T10:46:06\",\"modified_gmt\":\"2025-09-25T14:46:06\",\"slug\":\"practice-test-exceptions\",\"status\":\"publish\",\"type\":\"page\",\"link\":\"https:\\/\\/practicetestautomation.com\\/practice-test-exceptions\\/\",\"title\":{\"rendered\":\"Test Exceptions\"},\"content\":{\"rendered\":\"\\n<p class=\\\"\\\">This page is created to be able to reproduce the most common Selenium Exceptions. Follow test cases below to see exactly how to get: ElementNotInteractableException, ElementNotVisibleException, NoSuchElementException and StaleElementReferenceException. If you want to learn how to deal with these exceptions in your tests, check out my <a href=\\\"https:\\/\\/practicetestautomation.com\\/beginners-course-coupon\\\" target=\\\"_blank\\\" rel=\\\"noreferrer noopener\\\">Selenium WebDriver with Java for beginners program<\\/a>.<\\/p>\\n\\n\\n\\n<h5>Create list of your favorite foods<\\/h5>\\n\\t\\t<p id=\\\"instructions\\\">Push &#8220;Add&#8221; button to add another row<\\/p>\\n\\t\\t<div id=\\\"rows\\\">\\n\\t\\t\\t<div>\\n\\t\\t\\t\\t<div id=\\\"row1\\\" class=\\\"row\\\">\\n\\t\\t\\t\\t\\t<label for=\\\"row_input\\\">Row 1<\\/label>\\n\\t\\t\\t\\t\\t<input type=\\\"text\\\" class=\\\"input-field\\\" value=\\\"Pizza\\\" disabled=\\\"true\\\">\\n\\t\\t\\t\\t\\t<button id=\\\"edit_btn\\\" class=\\\"btn\\\" name=\\\"Edit\\\">Edit<\\/button>\\n\\t\\t\\t\\t\\t<button id=\\\"save_btn\\\" class=\\\"btn\\\" style=\\\"display: none;\\\" name=\\\"Save\\\">Save<\\/button>\\n\\t\\t\\t\\t\\t<button id=\\\"add_btn\\\" class=\\\"btn\\\" name=\\\"Add\\\">Add<\\/button>\\n\\t\\t\\t\\t<\\/div>\\n\\t\\t\\t<\\/div>\\n\\t\\t\\t<div id=\\\"loading\\\" style=\\\"display: none;\\\">Loading&#8230; <img data-recalc-dims=\\\"1\\\" decoding=\\\"async\\\" src=\\\"https:\\/\\/i0.wp.com\\/cdnjs.cloudflare.com\\/ajax\\/libs\\/semantic-ui\\/0.16.1\\/images\\/loader-large.gif?ssl=1\\\" alt=\\\"\\\"><\\/div>\\n\\t\\t\\t<div><\\/div>\\n\\t\\t\\t<div id=\\\"confirmation\\\">Row 2 was added<\\/div>\\n\\t\\t<\\/div>\\n\\n\\n\\n<hr class=\\\"wp-block-separator has-css-opacity\\\"\\/>\\n\\n\\n\\n<h5 class=\\\"wp-block-heading\\\">Test case 1: NoSuchElementException<\\/h5>\\n\\n\\n\\n<ol class=\\\"wp-block-list\\\">\\n<li class=\\\"\\\">Open page<\\/li>\\n\\n\\n\\n<li class=\\\"\\\">Click Add button<\\/li>\\n\\n\\n\\n<li class=\\\"\\\">Verify Row 2 input field is displayed<\\/li>\\n<\\/ol>\\n\\n\\n\\n<p class=\\\"\\\">Row 2 doesn&#8217;t appear immediately. This test will fail with org.openqa.selenium.NoSuchElementException without proper wait<\\/p>\\n\\n\\n\\n<hr class=\\\"wp-block-separator has-css-opacity\\\"\\/>\\n\\n\\n\\n<h5 class=\\\"wp-block-heading\\\">Test case 2: ElementNotInteractableException<\\/h5>\\n\\n\\n\\n<ol class=\\\"wp-block-list\\\">\\n<li class=\\\"\\\">Open page<\\/li>\\n\\n\\n\\n<li class=\\\"\\\">Click Add button<\\/li>\\n\\n\\n\\n<li class=\\\"\\\">Wait for the second row to load<\\/li>\\n\\n\\n\\n<li class=\\\"\\\">Type text into the second input field<\\/li>\\n\\n\\n\\n<li class=\\\"\\\">Push Save button using locator By.name(&#8220;Save&#8221;)<\\/li>\\n\\n\\n\\n<li class=\\\"\\\">Verify text saved<\\/li>\\n<\\/ol>\\n\\n\\n\\n<p class=\\\"\\\">This page contains two elements with attribute name=&#8221;Save&#8221;.<br>The first one is invisible. So when we are trying to click on the invisible element, we get ElementNotInteractableException.<\\/p>\\n\\n\\n\\n<p class=\\\"\\\">The same action used to throw ElementNotVisibleException, but now it throws a different exception (not sure if it&#8217;s a bug in Selenium or a feature)<\\/p>\\n\\n\\n\\n<hr class=\\\"wp-block-separator has-css-opacity\\\"\\/>\\n\\n\\n\\n<h5 class=\\\"wp-block-heading\\\">Test case 3: InvalidElementStateException<\\/h5>\\n\\n\\n\\n<ol class=\\\"wp-block-list\\\">\\n<li class=\\\"\\\">Open page<\\/li>\\n\\n\\n\\n<li class=\\\"\\\">Clear input field<\\/li>\\n\\n\\n\\n<li class=\\\"\\\">Type text into the input field<\\/li>\\n\\n\\n\\n<li class=\\\"\\\">Verify text changed<\\/li>\\n<\\/ol>\\n\\n\\n\\n<p class=\\\"\\\">The input field is disabled. Trying to clear the disabled field will throw InvalidElementStateException. We need to enable editing of the input field first by clicking the Edit button.<\\/p>\\n\\n\\n\\n<p class=\\\"\\\">If we try to type text into the disabled input field, we will get ElementNotInteractableException, as in Test case 2.<\\/p>\\n\\n\\n\\n<hr class=\\\"wp-block-separator has-css-opacity\\\"\\/>\\n\\n\\n\\n<h5 class=\\\"wp-block-heading\\\">Test case 4: StaleElementReferenceException<\\/h5>\\n\\n\\n\\n<ol class=\\\"wp-block-list\\\">\\n<li class=\\\"\\\">Open page<\\/li>\\n\\n\\n\\n<li class=\\\"\\\">Find the instructions text element<\\/li>\\n\\n\\n\\n<li class=\\\"\\\">Push add button<\\/li>\\n\\n\\n\\n<li class=\\\"\\\">Verify instruction text element is no longer displayed<\\/li>\\n<\\/ol>\\n\\n\\n\\n<p class=\\\"\\\">The instructions element is removed from the page when the second row is added. That&#8217;s why we can no longer interact with it. Otherwise, we will see StaleElementReferenceException.<\\/p>\\n\\n\\n\\n<hr class=\\\"wp-block-separator has-css-opacity\\\"\\/>\\n\\n\\n\\n<h5 class=\\\"wp-block-heading\\\">Test case 5: TimeoutException<\\/h5>\\n\\n\\n\\n<ol class=\\\"wp-block-list\\\">\\n<li class=\\\"\\\">Open page<\\/li>\\n\\n\\n\\n<li class=\\\"\\\">Click Add button<\\/li>\\n\\n\\n\\n<li class=\\\"\\\">Wait for 3 seconds for the second input field to be displayed<\\/li>\\n\\n\\n\\n<li class=\\\"\\\">Verify second input field is displayed<\\/li>\\n<\\/ol>\\n\\n\\n\\n<p class=\\\"\\\">The second row shows up after about 5 seconds, so a 3-second timeout is not enough. That&#8217;s why we will get TimeoutException while executing steps in the above test case.<\\/p>\\n\",\"protected\":false},\"excerpt\":{\"rendered\":\"<p>This page is created to be able to reproduce the most common Selenium Exceptions. Follow test cases below to see exactly how to get: ElementNotInteractableException,&#8230;<\\/p>\\n<div class=\\\"more-link-wrapper\\\"><a class=\\\"more-link\\\" href=\\\"https:\\/\\/practicetestautomation.com\\/practice-test-exceptions\\/\\\">Read More<span class=\\\"screen-reader-text\\\">Test Exceptions<\\/span><\\/a><\\/div>\\n\",\"protected\":false},\"author\":2,\"featured_media\":0,\"parent\":0,\"menu_order\":0,\"comment_status\":\"closed\",\"ping_status\":\"closed\",\"template\":\"test_exceptions.php\",\"meta\":{\"nf_dc_page\":\"\",\"_exactmetrics_skip_tracking\":false,\"_exactmetrics_sitenote_active\":false,\"_exactmetrics_sitenote_note\":\"\",\"_exactmetrics_sitenote_category\":0,\"footn