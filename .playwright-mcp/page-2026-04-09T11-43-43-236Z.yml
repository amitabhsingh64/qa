- generic [ref=e2]: "[{\"id\":963,\"date\":\"2025-10-31T12:15:13\",\"date_gmt\":\"2025-10-31T16:15:13\",\"guid\":{\"rendered\":\"https:\\/\\/practicetestautomation.com\\/?page_id=963\"},\"modified\":\"2025-10-31T12:15:19\",\"modified_gmt\":\"2025-10-31T16:15:19\",\"slug\":\"practice-test-table\",\"status\":\"publish\",\"type\":\"page\",\"link\":\"https:\\/\\/practicetestautomation.com\\/practice-test-table\\/\",\"title\":{\"rendered\":\"Test Table\"},\"content\":{\"rendered\":\"\\n<p class=\\\"\\\">This page is created to practice building XPath locators for real-world tables. Use the table below to locate specific cells, rows, and links based on attributes like <code>data-col<\\/code>, <code>headers<\\/code>, or text content. Try writing locators for courses by language, level, or enrollment numbers, and verify that clicking a course link opens the correct page. If you want to learn how to master XPath and apply it in Selenium tests, check out my <a href=\\\"https:\\/\\/practicetestautomation.com\\/xpath-course-coupon\\\">XPath Locators for Selenium<\\/a> program.<\\/p>\\n\\n\\n\\n<section id=\\\"xpath-table\\\">\\n <h2>Automation Courses<\\/h2>\\n\\n <!-- CONTROLS -->\\n <div class=\\\"controls-title\\\">\\n <h3>Filters<\\/h3>\\n <div class=\\\"reset-row\\\">\\n <button type=\\\"button\\\" id=\\\"resetFilters\\\" aria-label=\\\"Reset filters\\\">Reset<\\/button>\\n <\\/div>\\n <\\/div>\\n\\n <div class=\\\"filter-columns\\\">\\n <!-- Language -->\\n <fieldset class=\\\"filter-group vertical\\\">\\n <legend>Language<\\/legend>\\n <label><input type=\\\"radio\\\" name=\\\"lang\\\" value=\\\"Any\\\" checked> Any<\\/label>\\n <label><input type=\\\"radio\\\" name=\\\"lang\\\" value=\\\"Java\\\"> Java<\\/label>\\n <label><input type=\\\"radio\\\" name=\\\"lang\\\" value=\\\"Python\\\"> Python<\\/label>\\n <\\/fieldset>\\n\\n <!-- Level -->\\n <fieldset class=\\\"filter-group vertical\\\">\\n <legend>Level<\\/legend>\\n <label><input type=\\\"checkbox\\\" name=\\\"level\\\" value=\\\"Beginner\\\" checked> Beginner<\\/label>\\n <label><input type=\\\"checkbox\\\" name=\\\"level\\\" value=\\\"Intermediate\\\" checked> Intermediate<\\/label>\\n <label><input type=\\\"checkbox\\\" name=\\\"level\\\" value=\\\"Advanced\\\" checked> Advanced<\\/label>\\n <\\/fieldset>\\n\\n <!-- Min enrollments -->\\n <fieldset class=\\\"filter-group\\\">\\n <legend>Min enrollments<\\/legend>\\n <div\\n class=\\\"dropdown\\\"\\n id=\\\"enrollDropdown\\\"\\n data-value=\\\"any\\\"\\n tabindex=\\\"0\\\"\\n role=\\\"listbox\\\"\\n aria-label=\\\"Minimum enrollments\\\"\\n >\\n <div class=\\\"dropdown-button\\\" role=\\\"button\\\" tabindex=\\\"0\\\" aria-expanded=\\\"false\\\">\\n <span class=\\\"dropdown-label\\\">Any<\\/span>\\n <\\/div>\\n <ul class=\\\"dropdown-menu\\\" role=\\\"listbox\\\">\\n <li role=\\\"option\\\" data-value=\\\"any\\\" aria-selected=\\\"true\\\">Any<\\/li>\\n <li role=\\\"option\\\" data-value=\\\"5000\\\">5,000+<\\/li>\\n <li role=\\\"option\\\" data-value=\\\"10000\\\">10,000+<\\/li>\\n <li role=\\\"option\\\" data-value=\\\"50000\\\">50,000+<\\/li>\\n <\\/ul>\\n <\\/div>\\n <\\/fieldset>\\n\\n <div class=\\\"controls-sep\\\" aria-hidden=\\\"true\\\"><\\/div>\\n\\n <!-- Sort row -->\\n <div class=\\\"sort-row\\\">\\n <label for=\\\"sortBy\\\">Sort by:<\\/label>\\n <select id=\\\"sortBy\\\">\\n <option value=\\\"col_id\\\">ID<\\/option>\\n <option value=\\\"col_course\\\">Course Name<\\/option>\\n <option value=\\\"col_lang\\\">Language<\\/option>\\n <option value=\\\"col_level\\\">Level<\\/option>\\n <option value=\\\"col_enroll\\\">Enrollments<\\/option>\\n <\\/select>\\n <\\/div>\\n <\\/div>\\n <!-- \\/CONTROLS -->\\n\\n <div id=\\\"noData\\\" class=\\\"no-data\\\" style=\\\"display:none; margin:8px 0; font-weight:600;\\\">\\n No matching courses.\\n <\\/div>\\n\\n <table id=\\\"courses_table\\\" border=\\\"1\\\" cellpadding=\\\"6\\\" cellspacing=\\\"0\\\">\\n <thead>\\n <tr>\\n <th id=\\\"col_id\\\" scope=\\\"col\\\">ID<\\/th>\\n <th id=\\\"col_course\\\" scope=\\\"col\\\">Course Name<\\/th>\\n <th id=\\\"col_lang\\\" scope=\\\"col\\\">Language<\\/th>\\n <th id=\\\"col_level\\\" scope=\\\"col\\\">Level<\\/th>\\n <th id=\\\"col_enroll\\\" scope=\\\"col\\\">Enrollments<\\/th>\\n <th id=\\\"col_link\\\" scope=\\\"col\\\">Link<\\/th>\\n <\\/tr>\\n <\\/thead>\\n <tbody>\\n <tr>\\n <td headers=\\\"col_id\\\" data-col=\\\"id\\\">1517620<\\/td>\\n <td headers=\\\"col_course\\\" data-col=\\\"course\\\">Selenium Framework<\\/td>\\n <td headers=\\\"col_lang\\\" data-col=\\\"language\\\">Java<\\/td>\\n <td headers=\\\"col_level\\\" data-col=\\\"level\\\">Advanced<\\/td>\\n <td headers=\\\"col_enroll\\\" data-col=\\\"enrollments\\\">2667<\\/td>\\n <td headers=\\\"col_link\\\" data-col=\\\"link\\\">\\n <a href=\\\"https:\\/\\/practicetestautomation.com\\/selenium-webdriver-test-framework-from-scratch-referralCode\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\">View<\\/a>\\n <\\/td>\\n <\\/tr>\\n <tr>\\n <td headers=\\\"col_id\\\" data-col=\\\"id\\\">3970682<\\/td>\\n <td headers=\\\"col_course\\\" data-col=\\\"course\\\">Selenium Grid<\\/td>\\n <td headers=\\\"col_lang\\\" data-col=\\\"language\\\">Java<\\/td>\\n <td headers=\\\"col_level\\\" data-col=\\\"level\\\">Advanced<\\/td>\\n <td headers=\\\"col_enroll\\\" data-col=\\\"enrollments\\\">2207<\\/td>\\n <td headers=\\\"col_link\\\" data-col=\\\"link\\\">\\n <a href=\\\"https:\\/\\/practicetestautomation.com\\/selenium-grid\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\">View<\\/a>\\n <\\/td>\\n <\\/tr>\\n <tr>\\n <td headers=\\\"col_id\\\" data-col=\\\"id\\\">2854476<\\/td>\\n <td headers=\\\"col_course\\\" data-col=\\\"course\\\">REST Assured<\\/td>\\n <td headers=\\\"col_lang\\\" data-col=\\\"language\\\">Java<\\/td>\\n <td headers=\\\"col_level\\\" data-col=\\\"level\\\">Intermediate<\\/td>\\n <td headers=\\\"col_enroll\\\" data-col=\\\"enrollments\\\">8254<\\/td>\\n <td headers=\\\"col_link\\\" data-col=\\\"link\\\">\\n <a href=\\\"https:\\/\\/practicetestautomation.com\\/rest-assured-course-coupon\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\">View<\\/a>\\n <\\/td>\\n <\\/tr>\\n <tr>\\n <td headers=\\\"col_id\\\" data-col=\\\"id\\\">1743612<\\/td>\\n <td headers=\\\"col_course\\\" data-col=\\\"course\\\">XPath Locators<\\/td>\\n <td headers=\\\"col_lang\\\" data-col=\\\"language\\\">Any<\\/td>\\n <td headers=\\\"col_level\\\" data-col=\\\"level\\\">Beginner<\\/td>\\n <td headers=\\\"col_enroll\\\" data-col=\\\"enrollments\\\">14762<\\/td>\\n <td headers=\\\"col_link\\\" data-col=\\\"link\\\">\\n <a href=\\\"https:\\/\\/practicetestautomation.com\\/xpath-course-coupon\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\">View<\\/a>\\n <\\/td>\\n <\\/tr>\\n <tr>\\n <td headers=\\\"col_id\\\" data-col=\\\"id\\\">1904956<\\/td>\\n <td headers=\\\"col_course\\\" data-col=\\\"course\\\">Advanced Selenium<\\/td>\\n <td headers=\\\"col_lang\\\" data-col=\\\"language\\\">Java<\\/td>\\n <td headers=\\\"col_level\\\" data-col=\\\"level\\\">Intermediate<\\/td>\\n <td headers=\\\"col_enroll\\\" data-col=\\\"enrollments\\\">16452<\\/td>\\n <td headers=\\\"col_link\\\" data-col=\\\"link\\\">\\n <a href=\\\"https:\\/\\/practicetestautomation.com\\/advanced-course-coupon\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\">View<\\/a>\\n <\\/td>\\n <\\/tr>\\n <tr>\\n <td headers=\\\"col_id\\\" data-col=\\\"id\\\">5393658<\\/td>\\n <td headers=\\\"col_course\\\" data-col=\\\"course\\\">Python for Testers<\\/td>\\n <td headers=\\\"col_lang\\\" data-col=\\\"language\\\">Python<\\/td>\\n <td headers=\\\"col_level\\\" data-col=\\\"level\\\">Beginner<\\/td>\\n <td headers=\\\"col_enroll\\\" data-col=\\\"enrollments\\\">1365<\\/td>\\n <td headers=\\\"col_link\\\" data-col=\\\"link\\\">\\n <a href=\\\"https:\\/\\/practicetestautomation.com\\/python-for-testers\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\">View<\\/a>\\n <\\/td>\\n <\\/tr>\\n <tr>\\n <td headers=\\\"col_id\\\" data-col=\\\"id\\\">4536644<\\/td>\\n <td headers=\\\"col_course\\\" data-col=\\\"course\\\">Java for Testers<\\/td>\\n <td headers=\\\"col_lang\\\" data-col=\\\"language\\\">Java<\\/td>\\n <td headers=\\\"col_level\\\" data-col=\\\"level\\\">Beginner<\\/td>\\n <td headers=\\\"col_enroll\\\" data-col=\\\"enrollments\\\">6678<\\/td>\\n <td headers=\\\"col_link\\\" data-col=\\\"link\\\">\\n <a href=\\\"https:\\/\\/practicetestautomation.com\\/java-for-testers-udemy\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\">View<\\/a>\\n <\\/td>\\n <\\/tr>\\n <tr>\\n <td headers=\\\"col_id\\\" data-col=\\\"id\\\">4824578<\\/td>\\n <td headers=\\\"col_course\\\" data-col=\\\"course\\\">Selenium with Python<\\/td>\\n <td headers=\\\"col_lang\\\" data-col=\\\"language\\\">Python<\\/td>\\n <td headers=\\\"col_level\\\" data-col=\\\"level\\\">Beginner<\\/td>\\n <td headers=\\\"col_enroll\\\" data-col=\\\"enrollments\\\">10705<\\/td>\\n <td headers=\\\"col_link\\\" data-col=\\\"link\\\">\\n <a href=\\\"https:\\/\\/practicetestautomation.com\\/selenium-python-udemy\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\">View<\\/a>\\n <\\/td>\\n <\\/tr>\\n <tr>\\n <td headers=\\\"col_id\\\" data-col=\\\"id\\\">1693880<\\/td>\\n <td headers=\\\"col_course\\\" data-col=\\\"course\\\">Selenium with Java<\\/td>\\n <td headers=\\\"col_lang\\\" data-col=\\\"language\\\">Java<\\/td>\\n <td headers=\\\"col_level\\\" data-col=\\\"level\\\">Beginner<\\/td>\\n <td headers=\\\"col_enroll\\\" data-col=\\\"enrollments\\\">64284<\\/td>\\n <td headers=\\\"col_link\\\" data-col=\\\"link\\\">\\n <a href=\\\"https:\\/\\/practicetestautomation.com\\/beginners-course-coupon\\\" target=\\\"_blank\\\" rel=\\\"noopener noreferrer\\\">View<\\/a>\\n <\\/td>\\n <\\/tr>\\n <\\/tbody>\\n <\\/table>\\n\\n <script>\\n (function () {\\n \\/\\/ Elements\\n const table = document.getElementById('courses_table');\\n const tbody = table.querySelector('tbody');\\n const rowsAll = Array.from(tbody.querySelectorAll('tr'));\\n const sortSel = document.getElementById('sortBy');\\n\\n const enrollDD = document.getElementById('enrollDropdown');\\n const ddBtn = enrollDD.querySelector('.dropdown-button');\\n const ddMenu = enrollDD.querySelector('.dropdown-menu');\\n const ddLabel = enrollDD.querySelector('.dropdown-label');\\n\\n const resetBtn = document.getElementById('resetFilters');\\n\\n \\/\\/ Utils\\n function getColIndex(colId) {\\n const th = table.querySelector('th#' + colId);\\n return Array.from(th.parentNode.children).indexOf(th);\\n }\\n\\n function currentFilters() {\\n const lang = (document.querySelector('input[name=\\\"lang\\\"]:checked') || {}).value || 'Any';\\n const levels = Array.from(document.querySelectorAll('input[name=\\\"level\\\"]:checked')).map(i => i.value);\\n const minEnroll = enrollDD.dataset.value === 'any' ? 0 : Number(enrollDD.dataset.value);\\n return { lang, levels, minEnroll };\\n }\\n\\n function passes(row, { lang, levels, minEnroll }) {\\n const langTxt = row.querySelector('td[data-col=\\\"language\\\"]').innerText.trim();\\n const lvlTxt = row.querySelector('td[data-col=\\\"level\\\"]').innerText.trim();\\n const enrTxt = row.querySelector('td[data-col=\\\"enrollments\\\"]').innerText.replace(\\/[, ]\\/g, '');\\n const enrolls = Number(enrTxt) || 0;\\n\\n const langOk = (lang === 'Any') || (langTxt.toLowerCase() === lang.toLowerCase());\\n const lvlOk = levels.length === 0 ? false : levels.includes(lvlTxt);\\n const enrOk = enrolls >= minEnroll;\\n\\n return langOk && lvlOk && enrOk;\\n }\\n\\n function updateNoData() {\\n const visible = rowsAll.filter(r => r.style.display !== 'none').length;\\n const noDataEl = document.getElementById('noData');\\n\\n if (visible === 0) {\\n table.style.display = 'none';\\n if (noDataEl) noDataEl.style.display = 'block';\\n } else {\\n table.style.display = '';\\n if (noDataEl) noDataEl.style.display = 'none';\\n }\\n }\\n\\n function applyFilters() {\\n const f = currentFilters();\\n rowsAll.forEach(r => r.style.display = '');\\n rowsAll.forEach(r => { if (!passes(r, f)) r.style.display = 'none'; });\\n updateNoData();\\n }\\n\\n function applySort() {\\n if (!sortSel) return;\\n const colId = sortSel.value;\\n const colIndex = getColIndex(colId);\\n\\n const visibleRows = rowsAll.filter(r => r.style.display !== 'none');\\n visibleRows.sort((a, b) => {\\n const A = a.children[colIndex].innerText.trim();\\n const B = b.children[colIndex].innerText.trim();\\n return isNaN(A - B) ? A.localeCompare(B) : Number(A) - Number(B);\\n });\\n\\n const hidden = rowsAll.filter(r => r.style.display === 'none');\\n [...visibleRows, ...hidden].forEach(r => tbody.appendChild(r));\\n }\\n\\n function closeDD() {\\n enrollDD.classList.remove('open');\\n ddBtn.setAttribute('aria-expanded', 'false');\\n }\\n\\n function updateResetVisibility() {\\n const defaults = {\\n lang: 'Any',\\n levels: ['Beginner', 'Intermediate', 'Advanced'],\\n minEnroll: 0\\n };\\n const current = currentFilters();\\n\\n const sameLang = current.lang === defaults.lang;\\n const sameLevels = defaults.levels.every(l => current.levels.includes(l)) &&\\n current.levels.length === defaults.levels.length;\\n const sameEnroll = current.minEnroll === defaults.minEnroll;\\n\\n resetBtn.style.display = (sameLang && sameLevels && sameEnroll) ? 'none' : 'inline-block';\\n }\\n\\n \\/\\/ Events: filters\\n document.querySelectorAll('input[name=\\\"lang\\\"]').forEach(i => {\\n i.addEventListener('change', () => { applyFilters(); applySort(); updateResetVisibility(); });\\n });\\n\\n document.querySelectorAll('input[name=\\\"level\\\"]').forEach(i => {\\n i.addEventListener('change', () => { applyFilters(); applySort(); updateResetVisibility(); });\\n });\\n\\n \\/\\/ Events: dropdown\\n ddBtn.addEventListener('click', (e) => {\\n e.stopPropagation();\\n enrollDD.classList.toggle('open');\\n ddBtn.setAttribute('aria-expanded', enrollDD.classList.contains('open'));\\n });\\n\\n ddMenu.addEventListener('click', (e) => {\\n const li = e.target.closest('li[role=\\\"option\\\"]');\\n if (!li) return;\\n\\n ddMenu.querySelectorAll('li[role=\\\"option\\\"]').forEach(x => x.setAttribute('aria-selected', 'false'));\\n li.setAttribute('aria-selected', 'true');\\n\\n enrollDD.dataset.value = li.dataset.value;\\n ddLabel.textContent = li.textContent;\\n\\n closeDD();\\n applyFilters();\\n applySort();\\n updateResetVisibility();\\n });\\n\\n document.addEventListener('click', closeDD);\\n enrollDD.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDD(); });\\n\\n \\/\\/ Events: sort\\n if (sortSel) sortSel.addEventListener('change', applySort);\\n\\n \\/\\/ Reset button\\n resetBtn.addEventListener('click', () => {\\n \\/\\/ Language \\u2192 Any\\n const anyLang = document.querySelector('input[name=\\\"lang\\\"][value=\\\"Any\\\"]');\\n if (anyLang) anyLang.checked = true;\\n\\n \\/\\/ Levels \\u2192 all checked\\n document.querySelectorAll('input[name=\\\"level\\\"]').forEach(cb => cb.checked = true);\\n\\n \\/\\/ Min enrollments \\u2192 Any\\n enrollDD.dataset.value = 'any';\\n ddLabel.textContent = 'Any';\\n ddMenu.querySelectorAll('li[role=\\\"option\\\"]').forEach(li =>\\n li.setAttribute('aria-selected', li.dataset.value === 'any' ? 'true' : 'false')\\n );\\n\\n \\/\\/ Close dropdown\\n closeDD();\\n\\n \\/\\/ Recompute\\n applyFilters();\\n applySort();\\n updateResetVisibility();\\n });\\n\\n \\/\\/ Initial render\\n updateResetVisibility();\\n applyFilters();\\n applySort();\\n })();\\n <\\/script>\\n<\\/section>\\n\\n\\n\\n\\n<hr class=\\\"wp-block-separator has-alpha-channel-opacity\\\"\\/>\\n\\n\\n\\n<h5 class=\\\"wp-block-heading\\\">Test case 1: Language filter \\u2192 Java<\\/h5>\\n\\n\\n\\n<ol class=\\\"wp-block-list\\\">\\n<li class=\\\"\\\">Open page<\\/li>\\n\\n\\n\\n<li class=\\\"\\\">Select Language = Java<\\/li>\\n\\n\\n\\n<li class=\\\"\\\">Verify only Java courses are visible<\\/li>\\n<\\/ol>\\n\\n\\n\\n<p class=\\\"\\\">Fails if language filter is not reapplied on change<\\/p>\\n\\n\\n\\n<hr class=\\\"wp-block-separator has-alpha-channel-opacity\\\"\\/>\\n\\n\\n\\n<h5 class=\\\"wp-block-heading\\\">Test case 2: Level filter \\u2192 Beginner only<\\/h5>\\n\\n\\n\\n<ol class=\\\"wp-block-list\\\">\\n<li class=\\\"\\\">Open page<\\/li>\\n\\n\\n\\n<li class=\\\"\\\">Uncheck Intermediate and Advanced<\\/li>\\n\\n\\n\\n<li class=\\\"\\\">Verify that only Beginner courses are visible<\\/li>\\n<\\/ol>\\n\\n\\n\\n<p class=\\\"\\\">Fails if unchecked levels still pass the filter<\\/p>\\n\\n\\n\\n<hr class=\\\"wp-block-separator has-alpha-channel-opacity\\\"\\/>\\n\\n\\n\\n<h5 class=\\\"wp-block-heading\\\">Test case 3: Min enrollments \\u2192 10,000+<\\/h5>\\n\\n\\n\\n<ol class=\\\"wp-block-list\\\">\\n<li class=\\\"\\\">Open page<\\/li>\\n\\n\\n\\n<li class=\\\"\\\">Open \\u201cMin enrollments\\u201d dropdown and choose 10,000+<\\/li>\\n\\n\\n\\n<li class=\\\"\\\">Verify every visible row shows enrollments \\u2265 10,000<\\/li>\\n<\\/ol>\\n\\n\\n\\n<p class=\\\"\\\">Fails if numeric comparison is done as strings<\\/p>\\n\\n\\n\\n<hr class=\\\"wp-block-separator has-alpha-channel-opacity\\\"\\/>\\n\\n\\n\\n<h5 class=\\\"wp-block-heading\\\">Test case 4: Combined filters \\u2192 Python + Beginner + 10,000+<\\/h5>\\n\\n\\n\\n<ol class=\\\"wp-block-list\\\">\\n<li class=\\\"\\\">Open page<\\/li>\\n\\n\\n\\n<li class=\\\"\\\">Select Language = Python<\\/li>\\n\\n\\n\\n<li class=\\\"\\\">Uncheck Intermediate and Advanced<\\/li>\\n\\n\\n\\n<li class=\\\"\\\">Set Min enrollments = 10,000+<\\/li>\\n\\n\\n\\n<li class=\\\"\\\">Verify only Python Beginner courses with \\u2265 10,000 enrollments are visible<\\/li>\\n<\\/ol>\\n\\n\\n\\n<p class=\\\"\\\">Fails if incorrect courses are visible<\\/p>\\n\\n\\n\\n<hr class=\\\"wp-block-separator has-alpha-channel-opacity\\\"\\/>\\n\\n\\n\\n<h5 class=\\\"wp-block-heading\\\">Test case 5: No results state<\\/h5>\\n\\n\\n\\n<ol class=\\\"wp-block-list\\\">\\n<li class=\\\"\\\">Open page<\\/li>\\n\\n\\n\\n<li class=\\\"\\\">Select a combination that yields no matches (e.g., Language with Level that does not exist)<\\/li>\\n\\n\\n\\n<li class=\\\"\\\">Verify \\u201cNo matching courses.\\u201d is shown<\\/li>\\n<\\/ol>\\n\\n\\n\\n<p class=\\\"\\\">Fails if no-data state does not toggle with filters<\\/p>\\n\\n\\n\\n<hr class=\\\"wp-block-separator has-alpha-channel-opacity\\\"\\/>\\n\\n\\n\\n<h5 class=\\\"wp-block-heading\\\">Test case 6: Reset button visibility and behavior<\\/h5>\\n\\n\\n\\n<ol class=\\\"wp-block-list\\\">\\n<li class=\\\"\\\">Open page<\\/li>\\n\\n\\n\\n<li class=\\\"\\\">Change any filter<\\/li>\\n\\n\\n\\n<li class=\\\"\\\">Verify the Reset button becomes visible<\\/li>\\n\\n\\n\\n<li class=\\\"\\\">Click Reset<\\/li>\\n\\n\\n\\n<li class=\\\"\\\">Verify Language = Any, all Levels checked, Min enrollments = Any<\\/li>\\n\\n\\n\\n<li class=\\\"\\\">Verify the Reset button is hidden and all rows are visible<\\/li>\\n<\\/ol>\\n\\n\\n\\n<p class=\\\"\\\">Fails if defaults or visibility logic are not restored<\\/p>\\n\\n\\n\\n<hr class=\\\"wp-block-separator has-alpha-channel-opacity\\\"\\/>\\n\\n\\n\\n<h5 class=\\\"wp-block-heading\\\">Test case 7: Sort by Enrollments (ascending, numeric)<\\/h5>\\n\\n\\n\\n<ol class=\\\"wp-block-list\\\">\\n<li class=\\\"\\\">Open page<\\/li>\\n\\n\\n\\n<li class=\\\"\\\">Set Sort by = Enrollments<\\/li>\\n\\n\\n\\n<li class=\\\"\\\">Verify visible rows are ordered from smallest to largest enrollment<\\/li>\\n\\n\\n\\n<li class=\\\"\\\">Verify numbers with commas sort correctly<\\/li>\\n<\\/ol>\\n\\n\\n\\n<p class=\\\"\\\">Fails if the sort is lexicographic<\\/p>\\n\\n\\n\\n<hr class=\\\"wp-block-separator has-alpha-channel-opacity\\\"\\/>\\n\\n\\n\\n<h5 class=\\\"wp-block-heading\\\">Test case 8: Sort by Course Name (alphabetical)<\\/h5>\\n\\n\\n\\n<ol class=\\\"wp-block-list\\\">\\n<li class=\\\"\\\">Open page<\\/li>\\n\\n\\n\\n<li class=\\\"\\\">Set Sort by = Course Name<\\/li>\\n\\n\\n\\n<li class=\\\"\\\">Verify visible rows are ordered A\\u2192Z by course name<\\/li>\\n\\n\\n\\n<li class=\\\"\\\">Verify order updates after changing filters<\\/li>\\n<\\/ol>\\n\\n\\n\\n<p class=\\\"\\\">Fails if string compare ignores case\\/whitespace inconsistently<\\/p>\\n\\n\\n\\n<p class=\\\"\\\"><\\/p>\\n\",\"protected\":false},\"excerpt\":{\"rendered\":\"<p>This page is created to practice building XPath locators for real-world tables. Use the table below to locate specific cells, rows, and links based on&#8230;<\\/p>\\n<div class=\\\"more-link-wrapper\\\"><a class=\\\"more-link\\\" href=\\\"https:\\/\\/practicetestautomation.com\\/practice-test-table\\/\\\">Read More<span class=\\\"screen-reader-text\\\">Test Table<\\/span><\\/a><\\/div>\\n\",\"protected\":false},\"author\":2,\"featured_media\":0,\"parent\":0,\"menu_order\":0,\"comment_status\":\"closed\",\"ping_status\":\"closed\",\"template\":\"test_table.php\",\"meta\":{\"nf_dc_page\":\"\",\"_exactmetrics_skip_tracking\":false,\"_exactmetrics_sitenote_active\":false,\"_exactmetrics_sitenote_note\":\"\",\"_exactmetrics_sitenote_category\":0,\"footnotes\":\"\"},\"class_list\":[\"post-963\",\"page\",\"type-page\",\"status-publish\",\"hentry\",\"entry\"],\"yoast_head\":\"<!-- This site is optimized with the Yoast SEO plugin v26.9 - https:\\/\\/yoast.com\\/product\\/yoast-seo-wordpress\\/ -->\\n<title>Test Table | Practice Test Automation<\\/title>\\n<meta name=\\\"robots\\\" content=\\\"index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1\\\" \\/>\\n<link rel=\\\"canonical\\\" href=\\\"https:\\/\\/practicetestautomation.com\\/practice-test-table\\/\\\" \\/>\\n<meta property=\\\"og:locale\\\" content=\\\"en_US\\\" \\/>\\n<meta property=\\\"og:type\\\" content=\\\"article\\\" \\/>\\n<meta property=\\\"og:title\\\" content=\\\"Test Table | Practice Test Automation\\\" \\/>\\n<meta property=\\\"og:description\\\" content=\\\"This page is created to practice building XPath locators for real-world table